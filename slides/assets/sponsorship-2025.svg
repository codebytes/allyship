<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 800 460" width="800" height="460"><title id="chart-title">Who has a sponsor?</title><desc id="chart-desc">Women in the Workplace 2025: 31% of entry-level women and 45% of entry-level men report having a sponsor at work, a 14-percentage-point difference. A sponsor is someone other than their direct manager who advocates for career advancement or creates opportunities.</desc><g fill="#f4f3ee" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><rect width="800" height="460" fill="#171d30"/><text x="105" y="48" font-size="34" font-weight="700">Who has a sponsor?</text><g><rect x="105" y="70" width="18" height="18" rx="3" fill="#82e4ce"/><text x="133" y="84" font-size="18">Entry-level employees (%)</text></g><line x1="105" y1="375" x2="755" y2="375" stroke="#465169" stroke-width="1"/><text x="91" y="381" text-anchor="end" font-size="17">0</text><line x1="105" y1="322" x2="755" y2="322" stroke="#465169" stroke-width="1"/><text x="91" y="328" text-anchor="end" font-size="17">10</text><line x1="105" y1="269" x2="755" y2="269" stroke="#465169" stroke-width="1"/><text x="91" y="275" text-anchor="end" font-size="17">20</text><line x1="105" y1="216" x2="755" y2="216" stroke="#465169" stroke-width="1"/><text x="91" y="222" text-anchor="end" font-size="17">30</text><line x1="105" y1="163" x2="755" y2="163" stroke="#465169" stroke-width="1"/><text x="91" y="169" text-anchor="end" font-size="17">40</text><line x1="105" y1="110" x2="755" y2="110" stroke="#465169" stroke-width="1"/><text x="91" y="116" text-anchor="end" font-size="17">50</text><line x1="105" y1="375" x2="755" y2="375" stroke="#f4f3ee" stroke-width="2"/><line x1="105" y1="110" x2="105" y2="375" stroke="#f4f3ee" stroke-width="2"/><text x="267.5" y="405" text-anchor="middle" font-size="17">Women</text><text x="592.5" y="405" text-anchor="middle" font-size="17">Men</text><rect x="150.5" y="210.7" width="230" height="164.3" rx="3" fill="#82e4ce"/><text x="265.5" y="202.7" text-anchor="middle" font-size="16" font-weight="600">31</text><rect x="475.5" y="136.5" width="230" height="238.5" rx="3" fill="#82e4ce"/><text x="590.5" y="128.5" text-anchor="middle" font-size="16" font-weight="600">45</text><text x="25" y="242.5" text-anchor="middle" font-size="18" font-weight="600" transform="rotate(-90 25 242.5)">Employees (%)</text></g></svg>
