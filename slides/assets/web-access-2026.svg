<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 800 460" width="800" height="460">
<title id="chart-title">Common, detectable barriers</title><desc id="chart-desc">WebAIM Million February 2026: 83.9% of tested home pages had low-contrast text, 53.1% had images missing alternative text, and 51% had form inputs missing labels. Categories overlap and automated checks find only a subset of accessibility problems.</desc>
