<title id="chart-title">Who is missing from the story?</title><desc id="chart-desc">Among 100 top films of 2025, 78 had no LGBTQ+ speaking characters, 49 had no speaking characters with disabilities, and 81 had no girls or women with disabilities. Films and identity categories overlap; do not sum the counts.</desc>
