<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 800 460" width="800" height="460">
<title id="chart-title">Past-year workplace discrimination</title><desc id="chart-desc">Williams Institute 2024 report, summer 2023 survey of LGBTQ workers: 7% of White LGBTQ respondents and 15% of LGBTQ respondents of color reported discrimination in the past year. Self-reported discrimination, not the combined measure of discrimination or harassment.</desc>
<rect width="800" height="460" fill="#171d30"/>
<g fill="#f4f3ee" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<text x="30" y="46" font-size="30" font-weight="700">Past-year workplace discrimination</text>
<text x="30" y="78" font-size="18">Discrimination (%)</text>
<line x1="285" y1="105" x2="285" y2="380" stroke="#465169"/>
<text x="285" y="408" text-anchor="middle" font-size="18">0</text>
<line x1="430" y1="105" x2="430" y2="380" stroke="#465169"/>
<text x="430" y="408" text-anchor="middle" font-size="18">5</text>
<line x1="575" y1="105" x2="575" y2="380" stroke="#465169"/>
<text x="575" y="408" text-anchor="middle" font-size="18">10</text>
<line x1="720" y1="105" x2="720" y2="380" stroke="#465169"/>
<text x="720" y="408" text-anchor="middle" font-size="18">15</text>
<text x="265" y="181.75" text-anchor="end" font-size="24">White LGBTQ</text>
<rect x="285" y="159.75" width="203" height="28" rx="3" fill="#c4b5fd"/>
<text x="498" y="181.75" font-size="25" font-weight="700">7</text>
<text x="265" y="319.25" text-anchor="end" font-size="24">LGBTQ of color</text>
<rect x="285" y="297.25" width="435" height="28" rx="3" fill="#c4b5fd"/>
<text x="730" y="319.25" font-size="25" font-weight="700">15</text>
<text x="502.5" y="444" text-anchor="middle" font-size="19">Respondents in each group (%)</text>
</g></svg>
