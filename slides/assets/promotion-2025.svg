<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 1100 420" width="1100" height="420"><title id="chart-title">The first step up to manager</title><desc id="chart-desc">Women in the Workplace 2025, using calendar-year 2024 promotions: normalized to 100 men promoted to manager, the report shows 93 women overall, 82 Asian women, 82 Latinas, and 60 Black women. These groups overlap: women overall includes the displayed subgroups. These are promotion-rate ratios, not percentages of all promotions.</desc><g fill="#f4f3ee" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><rect width="1100" height="420" fill="#171d30"/><text x="105" y="48" font-size="34" font-weight="700">The first step up to manager</text><g><rect x="105" y="70" width="18" height="18" rx="3" fill="#82e4ce"/><text x="133" y="84" font-size="18">Promotion-rate index</text></g><line x1="105" y1="335" x2="1055" y2="335" stroke="#465169" stroke-width="1"/><text x="91" y="341" text-anchor="end" font-size="17">0</text><line x1="105" y1="290" x2="1055" y2="290" stroke="#465169" stroke-width="1"/><text x="91" y="296" text-anchor="end" font-size="17">20</text><line x1="105" y1="245" x2="1055" y2="245" stroke="#465169" stroke-width="1"/><text x="91" y="251" text-anchor="end" font-size="17">40</text><line x1="105" y1="200" x2="1055" y2="200" stroke="#465169" stroke-width="1"/><text x="91" y="206" text-anchor="end" font-size="17">60</text><line x1="105" y1="155" x2="1055" y2="155" stroke="#465169" stroke-width="1"/><text x="91" y="161" text-anchor="end" font-size="17">80</text><line x1="105" y1="110" x2="1055" y2="110" stroke="#465169" stroke-width="1"/><text x="91" y="116" text-anchor="end" font-size="17">100</text><line x1="105" y1="335" x2="1055" y2="335" stroke="#f4f3ee" stroke-width="2"/><line x1="105" y1="110" x2="105" y2="335" stroke="#f4f3ee" stroke-width="2"/><text x="200" y="365" text-anchor="middle" font-size="17">Men</text><text x="390" y="365" text-anchor="middle" font-size="17">Women</text><text x="580" y="365" text-anchor="middle" font-size="17">Asian women</text><text x="770" y="365" text-anchor="middle" font-size="17">Latinas</text><text x="960" y="365" text-anchor="middle" font-size="17">Black women</text><rect x="131.60000000000002" y="110" width="132.79999999999998" height="225" rx="3" fill="#82e4ce"/><text x="198" y="102" text-anchor="middle" font-size="16" font-weight="600">100</text><rect x="321.6" y="125.75" width="132.79999999999998" height="209.25" rx="3" fill="#82e4ce"/><text x="388" y="117.75" text-anchor="middle" font-size="16" font-weight="600">93</text><rect x="511.6" y="150.5" width="132.79999999999998" height="184.5" rx="3" fill="#82e4ce"/><text x="578" y="142.5" text-anchor="middle" font-size="16" font-weight="600">82</text><rect x="701.6" y="150.5" width="132.79999999999998" height="184.5" rx="3" fill="#82e4ce"/><text x="768" y="142.5" text-anchor="middle" font-size="16" font-weight="600">82</text><rect x="891.6" y="200" width="132.79999999999998" height="135" rx="3" fill="#82e4ce"/><text x="958" y="192" text-anchor="middle" font-size="16" font-weight="600">60</text><text x="25" y="222.5" text-anchor="middle" font-size="18" font-weight="600" transform="rotate(-90 25 222.5)">Men = 100</text></g></svg>
