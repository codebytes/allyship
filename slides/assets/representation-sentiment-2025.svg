<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 800 460" width="800" height="460"><title id="chart-title">More likely to play?</title><desc id="chart-desc">Geena Davis Institute / Nielsen, Ready Players All (2025): 62% agree that they are more likely to play a video game if the playable characters are diverse; 9% disagree; the remainder, calculated as 29%, neither agree nor disagree. U.S./U.K. gamers surveyed June 10-15, 2024. The short report does not state the sample size. Stated preference is not observed play or sales.</desc><g fill="#f4f3ee" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><rect width="800" height="460" fill="#171d30"/><text x="105" y="48" font-size="34" font-weight="700">More likely to play?</text><g><rect x="105" y="70" width="18" height="18" rx="3" fill="#c4b5fd"/><text x="133" y="84" font-size="18">Diverse playable characters</text></g><line x1="105" y1="375" x2="755" y2="375" stroke="#465169" stroke-width="1"/><text x="91" y="381" text-anchor="end" font-size="17">0</text><line x1="105" y1="308.75" x2="755" y2="308.75" stroke="#465169" stroke-width="1"/><text x="91" y="314.75" text-anchor="end" font-size="17">20</text><line x1="105" y1="242.5" x2="755" y2="242.5" stroke="#465169" stroke-width="1"/><text x="91" y="248.5" text-anchor="end" font-size="17">40</text><line x1="105" y1="176.25" x2="755" y2="176.25" stroke="#465169" stroke-width="1"/><text x="91" y="182.25" text-anchor="end" font-size="17">60</text><line x1="105" y1="110" x2="755" y2="110" stroke="#465169" stroke-width="1"/><text x="91" y="116" text-anchor="end" font-size="17">80</text><line x1="105" y1="375" x2="755" y2="375" stroke="#f4f3ee" stroke-width="2"/><line x1="105" y1="110" x2="105" y2="375" stroke="#f4f3ee" stroke-width="2"/><text x="213.33333333333331" y="405" text-anchor="middle" font-size="17">Agree</text><text x="430" y="405" text-anchor="middle" font-size="17">Neither</text><text x="646.6666666666666" y="405" text-anchor="middle" font-size="17">Disagree</text><rect x="135.33333333333331" y="169.625" width="152" height="205.375" rx="3" fill="#c4b5fd"/><text x="211.33333333333331" y="161.625" text-anchor="middle" font-size="16" font-weight="600">62</text><rect x="351.99999999999994" y="278.9375" width="152" height="96.0625" rx="3" fill="#c4b5fd"/><text x="427.99999999999994" y="270.9375" text-anchor="middle" font-size="16" font-weight="600">29</text><rect x="568.6666666666666" y="345.1875" width="152" height="29.8125" rx="3" fill="#c4b5fd"/><text x="644.6666666666666" y="337.1875" text-anchor="middle" font-size="16" font-weight="600">9</text><text x="25" y="242.5" text-anchor="middle" font-size="18" font-weight="600" transform="rotate(-90 25 242.5)">Respondents (%)</text></g></svg>
