<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 800 460" width="800" height="460"><title id="chart-title">Ethnicity of preset characters</title><desc id="chart-desc">DiamondLobby reports 61.2% white and 38.8% all other ethnicities combined among human or human-like characters in its historical sample. The ethnic subsample size is not reported.</desc><g fill="#f4f3ee" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><rect width="800" height="460" fill="#171d30"/><text x="105" y="48" font-size="34" font-weight="700">Ethnicity of preset characters</text><g><rect x="105" y="70" width="18" height="18" rx="3" fill="#c4b5fd"/><text x="133" y="84" font-size="18">Human / human-like characters (%)</text></g><line x1="105" y1="375" x2="755" y2="375" stroke="#465169" stroke-width="1"/><text x="91" y="381" text-anchor="end" font-size="17">0</text><line x1="105" y1="308.75" x2="755" y2="308.75" stroke="#465169" stroke-width="1"/><text x="91" y="314.75" text-anchor="end" font-size="17">20</text><line x1="105" y1="242.5" x2="755" y2="242.5" stroke="#465169" stroke-width="1"/><text x="91" y="248.5" text-anchor="end" font-size="17">40</text><line x1="105" y1="176.25" x2="755" y2="176.25" stroke="#465169" stroke-width="1"/><text x="91" y="182.25" text-anchor="end" font-size="17">60</text><line x1="105" y1="110" x2="755" y2="110" stroke="#465169" stroke-width="1"/><text x="91" y="116" text-anchor="end" font-size="17">80</text><line x1="105" y1="375" x2="755" y2="375" stroke="#f4f3ee" stroke-width="2"/><line x1="105" y1="110" x2="105" y2="375" stroke="#f4f3ee" stroke-width="2"/><text x="267.5" y="405" text-anchor="middle" font-size="17">White</text><text x="592.5" y="405" text-anchor="middle" font-size="17">All others</text><rect x="150.5" y="172.27499999999998" width="230" height="202.72500000000002" rx="3" fill="#c4b5fd"/><text x="265.5" y="164.27499999999998" text-anchor="middle" font-size="16" font-weight="600">61.2</text><rect x="475.5" y="246.475" width="230" height="128.525" rx="3" fill="#c4b5fd"/><text x="590.5" y="238.475" text-anchor="middle" font-size="16" font-weight="600">38.8</text><text x="25" y="242.5" text-anchor="middle" font-size="18" font-weight="600" transform="rotate(-90 25 242.5)">Characters (%)</text></g></svg>
